name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claims-intake:ci .
      - name: container starts and serves /healthz
        run: |
          docker run -d --name api -p 8000:8000 -e INGEST_API_KEY=ci -e REVIEWER_API_KEY=ci claims-intake:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs api; exit 1
